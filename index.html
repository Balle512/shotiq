<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHOTIQ - Football Analytics</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d19;color:#eef3ff;font-family:Arial,sans-serif}
header{padding:25px 7%;background:#0d1526;border-bottom:1px solid #1d2b43}
.logo{font-size:30px;font-weight:900;letter-spacing:3px;color:#62a5ff}
.logo span{color:white}
header p{color:#8da2c1;margin:7px 0 0}
main{max-width:1100px;margin:30px auto;padding:0 18px}
.panel{background:#101a2d;border:1px solid #21314b;border-radius:14px;padding:20px;margin-bottom:20px}
h2{font-size:19px;margin:0 0 17px}
h3{font-size:16px;margin:22px 0 12px}
label{display:block;color:#9eb1ce;font-size:13px;margin:12px 0 7px}
select,input,button{background:#0a1323;color:white;border:1px solid #304361;border-radius:8px;padding:12px;font-size:15px;width:100%}
button{background:#2679e8;border:0;font-weight:bold;cursor:pointer;margin-top:15px}
button:disabled{opacity:.5;cursor:wait}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.muted{color:#91a5c2;font-size:13px}
.fixture,.match{padding:13px;border-bottom:1px solid #263650}
.fixture:last-child,.match:last-child{border:0}
.score{color:#70adff;font-weight:bold}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:#0a1425;padding:16px;border-radius:10px}
.stat small{color:#92a8c8}
.stat strong{display:block;font-size:25px;margin-top:8px}
canvas{width:100%;height:260px;background:#0a1425;border-radius:10px}
.status{color:#80b5ff;font-size:13px;margin-top:12px}
.error{color:#ff9b9b}
.match-title{font-weight:bold;margin-bottom:8px}
.match-stats{color:#a9bad3;font-size:13px;line-height:1.8}
</style>
</head>
<body>
<header>
<div class="logo">SHOT<span>IQ</span></div>
<p>Football statistics. Smarter analysis.</p>
</header>
<main>
<section class="panel">
<h2>Matcher</h2>
<div class="grid">
<div>
<label>Datum</label>
<input type="date" id="date">
</div>
<div>
<label>Liga</label>
<select id="league">
<option value="">Alla ligor</option>
<option value="39">Premier League</option>
<option value="140">La Liga</option>
</select>
</div>
</div>
<button id="loadMatches">Visa matcher</button>
<div id="fixtures" class="muted">Välj datum och tryck på Visa matcher.</div>
</section>
<section class="panel">
<h2>Lagstatistik</h2>
<div class="grid">
<div>
<label>Välj liga</label>
<select id="teamLeague">
<option value="39">Premier League</option>
<option value="140">La Liga</option>
</select>
</div>
<div>
<label>Välj lag</label>
<select id="team">
<option value="">Laddar lag...</option>
</select>
</div>
<div>
<label>Senaste matcher</label>
<select id="last">
<option value="5">5 matcher</option>
<option value="10">10 matcher</option>
<option value="15">15 matcher</option>
</select>
</div>
</div>
<button id="loadStats">Visa lagstatistik</button>
<div id="status" class="status"></div>
</section>
<section class="panel" id="results" hidden>
<h2 id="teamTitle">Statistik</h2>
<div class="cards" id="summary"></div>
<h3>Utveckling senaste matcherna</h3>
<canvas id="chart" width="1000" height="300"></canvas>
<div class="muted">Blå linje = skott för. Ljus linje = skott emot.</div>
<h3>Matchhistorik</h3>
<div id="history"></div>
</section>
</main>
<script>
const API = "https://shotiq-api.alvinhogedal.workers.dev";
const $ = id => document.getElementById(id);
function showStatus(message, error=false){
 $("status").textContent = message;
 $("status").className = error ? "status error" : "status";
}
function sleep(ms){
 return new Promise(resolve => setTimeout(resolve,ms));
}
async function getData(path){
 const response = await fetch(API + path);
 const data = await response.json();
 if(!response.ok || data.error){
   throw new Error(data.details?.rateLimit || data.error || "Något gick fel");
 }
 return data;
}
function setToday(){
 const today = new Date();
 const local = new Date(today.getTime() - today.getTimezoneOffset()*60000);
 $("date").value = local.toISOString().slice(0,10);
}
async function loadTeams(){
 const league = $("teamLeague").value;
 const select = $("team");
 select.innerHTML = '<option value="">Laddar lag...</option>';
 try{
   const data = await getData("/teams?league=" + league);
   select.innerHTML = "";
   data.response.forEach(item => {
     const option = document.createElement("option");
     option.value = item.team.id;
     option.textContent = item.team.name;
     select.appendChild(option);
   });
   if(!data.response.length){
     select.innerHTML = '<option value="">Inga lag hittades</option>';
   }
 }catch(error){
   select.innerHTML = '<option value="">Kunde inte ladda lag</option>';
   showStatus("Kunde inte ladda lagen: " + error.message,true);
 }
}
async function loadMatches(){
 const date = $("date").value;
 const league = $("league").value;
 const output = $("fixtures");
 if(!date){
   output.textContent = "Välj ett datum först.";
   return;
 }
 output.textContent = "Hämtar matcher...";
 try{
   const data = await getData("/matches?date=" + date);
   let matches = data.response || [];
   matches = matches.filter(match =>
     [39,140].includes(Number(match.league.id))
   );
   if(league){
     matches = matches.filter(match =>
       String(match.league.id) === league
     );
   }
   if(!matches.length){
     output.textContent = "Inga matcher hittades för detta datum.";
     return;
   }
   output.innerHTML = "";
   matches.forEach(match => {
     const div = document.createElement("div");
     div.className = "fixture";
     const home = match.teams.home.name;
     const away = match.teams.away.name;
     const goals = match.goals.home === null
       ? "vs"
       : match.goals.home + " - " + match.goals.away;
     div.innerHTML =
       '<div><strong>' + home + '</strong> <span class="score">' +
       goals + '</span> <strong>' + away + '</strong></div>' +
       '<div class="muted">' + match.league.name +
       ' · ' + match.fixture.status.long + '</div>';
     output.appendChild(div);
   });
 }catch(error){
   output.textContent = "Fel: " + error.message;
 }
}
function getStat(stats,type){
 const item = stats.find(s => s.type === type);
 return item && item.value !== null ? Number(item.value) : 0;
}
async function loadStats(){
 const teamId = $("team").value;
 const teamName = $("team").selectedOptions[0]?.textContent;
 const last = $("last").value;
 const button = $("loadStats");
 if(!teamId){
   showStatus("Välj ett lag först.",true);
   return;
 }
 button.disabled = true;
 $("results").hidden = true;
 showStatus("Hämtar matchhistorik...");
 try{
   const data = await getData(
     "/history?team=" + teamId + "&last=" + last
   );
   const matches = data.response || [];
   if(!matches.length){
     showStatus("Inga matcher hittades för laget.",true);
     return;
   }
   const records = [];
   for(let i=0;i<matches.length;i++){
     const match = matches[i];
     showStatus("Hämtar statistik: match " + (i+1) + " av " + matches.length);
     // Vänta mellan statistikförfrågningar för att minska risken
     // att API-tjänstens gräns för anrop per minut överskrids.
     if(i > 0) await sleep(6500);
     const statsData = await getData(
       "/stats?fixture=" + match.fixture.id
     );
     const teams = statsData.response || [];
     const selected = teams.find(t => String(t.team.id) === String(teamId));
     if(!selected){
       records.push({
         match,
         shots:0,
         against:0,
         onTarget:0,
         againstOnTarget:0,
         corners:0,
         againstCorners:0
       });
       continue;
     }
     const opponent = teams.find(t => String(t.team.id) !== String(teamId));
     const s = selected.statistics || [];
     const o = opponent ? opponent.statistics || [] : [];
     records.push({
       match,
       shots:getStat(s,"Total Shots"),
       against:getStat(o,"Total Shots"),
       onTarget:getStat(s,"Shots on Goal"),
       againstOnTarget:getStat(o,"Shots on Goal"),
       corners:getStat(s,"Corner Kicks"),
       againstCorners:getStat(o,"Corner Kicks")
     });
   }
   renderResults(records,teamName);
   showStatus("Klart! Statistiken är hämtad.");
 }catch(error){
   showStatus("Kunde inte hämta statistiken: " + error.message,true);
 }finally{
   button.disabled = false;
 }
}
function renderResults(records,teamName){
 $("results").hidden = false;
 $("teamTitle").textContent = teamName + " – senaste " + records.length + " matcherna";
 const total = key => records.reduce((sum,r)=>sum+r[key],0);
 const avg = key => (total(key)/records.length).toFixed(1);
 $("summary").innerHTML = `
<div class="stat"><small>Skott för / match</small><strong>${avg("shots")}</strong></div>
<div class="stat"><small>Skott emot / match</small><strong>${avg("against")}</strong></div>
<div class="stat"><small>Skott på mål / match</small><strong>${avg("onTarget")}</strong></div>
<div class="stat"><small>Hörnor / match</small><strong>${avg("corners")}</strong></div>
 `;
 $("history").innerHTML = "";
 records.forEach(r => {
   const m = r.match;
   const home = m.teams.home;
   const away = m.teams.away;
   const isHome = String(home.id) === String($("team").value);
   const opponent = isHome ? away.name : home.name;
   const goals = isHome
     ? m.goals.home + " - " + m.goals.away
     : m.goals.away + " - " + m.goals.home;
   const date = new Date(m.fixture.date).toLocaleDateString("sv-SE");
   const div = document.createElement("div");
   div.className = "match";
   div.innerHTML = `
<div class="match-title">${date} · ${opponent} · ${goals}</div>
<div class="match-stats">
       Skott: ${r.shots} – ${r.against}<br>
       Skott på mål: ${r.onTarget} – ${r.againstOnTarget}<br>
       Hörnor: ${r.corners} – ${r.againstCorners}
</div>
   `;
   $("history").appendChild(div);
 });
 drawChart(records);
}
function drawChart(records){
 const canvas = $("chart");
 const ctx = canvas.getContext("2d");
 const w = canvas.width;
 const h = canvas.height;
 const pad = 45;
 ctx.clearRect(0,0,w,h);
 const max = Math.max(
   10,
   ...records.map(r=>Math.max(r.shots,r.against))
 ) + 3;
 ctx.strokeStyle = "#263650";
 ctx.fillStyle = "#91a5c2";
 ctx.font = "13px Arial";
 for(let i=0;i<=4;i++){
   const y = pad + (h-pad*2)*i/4;
   ctx.beginPath();
   ctx.moveTo(pad,y);
   ctx.lineTo(w-pad,y);
   ctx.stroke();
   ctx.fillText(Math.round(max*(1-i/4)),8,y+4);
 }
 function line(key,color){
   ctx.beginPath();
   ctx.strokeStyle = color;
   ctx.lineWidth = 3;
   records.forEach((r,i)=>{
     const x = pad + (w-pad*2)*(records.length===1 ? 0.5 : i/(records.length-1));
     const y = h-pad - (r[key]/max)*(h-pad*2);
     if(i===0) ctx.moveTo(x,y);
     else ctx.lineTo(x,y);
   });
   ctx.stroke();
   records.forEach((r,i)=>{
     const x = pad + (w-pad*2)*(records.length===1 ? 0.5 : i/(records.length-1));
     const y = h-pad - (r[key]/max)*(h-pad*2);
     ctx.beginPath();
     ctx.fillStyle = color;
     ctx.arc(x,y,4,0,Math.PI*2);
     ctx.fill();
   });
 }
 line("shots","#4b9cff");
 line("against","#d8e4f5");
}
$("teamLeague").addEventListener("change",loadTeams);
$("loadMatches").addEventListener("click",loadMatches);
$("loadStats").addEventListener("click",loadStats);
setToday();
loadTeams();
</script>
</body>
</html>
