<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHOTIQ | Football Analytics</title>
<style>
* {
 box-sizing: border-box;
}
body {
 margin: 0;
 background: #080d18;
 color: #f4f7ff;
 font-family: Arial, sans-serif;
}
header {
 padding: 22px 7%;
 background: #0c1423;
 border-bottom: 1px solid #263650;
 display: flex;
 justify-content: space-between;
 align-items: center;
}
.logo {
 font-size: 29px;
 font-weight: 900;
}
.logo span {
 color: #37c9ff;
}
.status {
 color: #35e6a0;
 font-size: 12px;
}
main {
 max-width: 1100px;
 margin: auto;
 padding: 35px 20px;
}
h1 {
 font-size: 36px;
 margin-bottom: 8px;
}
.subtitle {
 color: #94a6c2;
 margin-bottom: 30px;
}
.filters {
 background: #111a2b;
 border: 1px solid #263650;
 border-radius: 14px;
 padding: 20px;
 display: grid;
 grid-template-columns: 1fr 1fr auto;
 gap: 14px;
}
label {
 display: block;
 color: #94a6c2;
 font-size: 12px;
 margin-bottom: 8px;
}
input, select {
 width: 100%;
 padding: 13px;
 border-radius: 8px;
 border: 1px solid #263650;
 background: #0a1322;
 color: white;
 font-size: 15px;
}
button {
 border: none;
 border-radius: 8px;
 background: #37c9ff;
 color: #07111c;
 padding: 13px 20px;
 font-weight: bold;
 cursor: pointer;
 align-self: end;
}
.section-title {
 margin: 32px 0 15px;
 font-size: 21px;
}
.matches {
 display: grid;
 gap: 13px;
}
.match {
 background: #111a2b;
 border: 1px solid #263650;
 border-radius: 13px;
 padding: 20px;
}
.league {
 color: #37c9ff;
 font-size: 12px;
 margin-bottom: 17px;
}
.teams {
 display: grid;
 grid-template-columns: 1fr auto 1fr;
 align-items: center;
 gap: 12px;
 font-weight: bold;
}
.home {
 text-align: left;
}
.away {
 text-align: right;
}
.score {
 color: #37c9ff;
 font-size: 22px;
}
.meta {
 color: #94a6c2;
 font-size: 12px;
 margin-top: 15px;
}
.empty {
 background: #111a2b;
 border: 1px solid #263650;
 border-radius: 13px;
 padding: 30px;
 text-align: center;
 color: #94a6c2;
}
footer {
 text-align: center;
 color: #65758f;
 padding: 35px;
 font-size: 12px;
}
@media(max-width: 650px) {
 header {
   padding: 20px;
 }
 main {
   padding: 25px 15px;
 }
 .filters {
   grid-template-columns: 1fr;
 }
 button {
   width: 100%;
 }
 h1 {
   font-size: 29px;
 }
 .teams {
   font-size: 13px;
 }
}
</style>
</head>
<body>
<header>
<div class="logo">SHOT<span>IQ</span></div>
<div class="status">● LIVE FOOTBALL DATA</div>
</header>
<main>
<h1>Match Center</h1>
<p class="subtitle">Premier League & La Liga — Football Analytics</p>
<section class="filters">
<div>
<label for="date">Välj datum</label>
<input type="date" id="date">
</div>
<div>
<label for="league">Välj liga</label>
<select id="league">
<option value="all">Båda ligorna</option>
<option value="39">Premier League</option>
<option value="140">La Liga</option>
</select>
</div>
<button onclick="searchMatches()">SÖK MATCHER</button>
</section>
<h2 class="section-title">Matcher</h2>
<section id="matches" class="matches">
<div class="empty">Laddar matcher...</div>
</section>
</main>
<footer>SHOTIQ FOOTBALL ANALYTICS</footer>
<script>
const API = "https://shotiq-api.alvinhogedal.workers.dev";
const dateInput = document.getElementById("date");
const leagueInput = document.getElementById("league");
const matches = document.getElementById("matches");
dateInput.value = new Date().toLocaleDateString("sv-SE");
async function searchMatches() {
 const date = dateInput.value;
 const selectedLeague = leagueInput.value;
 if (!date) {
   matches.textContent = "Välj ett datum först.";
   return;
 }
 matches.innerHTML = '<div class="empty">Hämtar matcher...</div>';
 try {
   const response = await fetch(
     `${API}/matches?date=${encodeURIComponent(date)}`
   );
   const data = await response.json();
   if (!response.ok || data.errors?.rateLimit) {
     throw new Error("API-gränsen är nådd. Försök senare.");
   }
   if (!Array.isArray(data.response)) {
     throw new Error("Kunde inte läsa matcherna.");
   }
   const filtered = data.response.filter(item => {
     const leagueId = String(item.league?.id);
     return (
       leagueId === "39" || leagueId === "140"
     ) && (
       selectedLeague === "all" ||
       leagueId === selectedLeague
     );
   });
   if (filtered.length === 0) {
     matches.innerHTML =
       '<div class="empty">Inga matcher hittades för vald liga och datum.</div>';
     return;
   }
   matches.innerHTML = filtered.map(item => {
     const home = item.teams?.home?.name || "Hemmalag";
     const away = item.teams?.away?.name || "Bortalag";
     const league = item.league?.name || "Okänd liga";
     const time = item.fixture?.date
       ? new Date(item.fixture.date).toLocaleTimeString("sv-SE", {
           hour: "2-digit",
           minute: "2-digit"
         })
       : "";
     const status = item.fixture?.status?.short || "";
     const elapsed = item.fixture?.status?.elapsed;
     const goals = item.goals || {};
     const score =
       goals.home != null && goals.away != null
         ? `${goals.home} - ${goals.away}`
         : "VS";
     return `
<article class="match">
<div class="league">${escapeHTML(league)}</div>
<div class="teams">
<span class="home">${escapeHTML(home)}</span>
<span class="score">${escapeHTML(score)}</span>
<span class="away">${escapeHTML(away)}</span>
</div>
<div class="meta">
           ${escapeHTML(time)} · ${escapeHTML(status)}
           ${elapsed != null ? ` · ${elapsed}'` : ""}
</div>
</article>
     `;
   }).join("");
 } catch (error) {
   matches.innerHTML =
     `<div class="empty">${escapeHTML(error.message)}</div>`;
 }
}
function escapeHTML(value) {
 return String(value).replace(/[&<>"']/g, char => ({
   "&": "&amp;",
   "<": "&lt;",
   ">": "&gt;",
   '"': "&quot;",
   "'": "&#39;"
 })[char]);
}
searchMatches();
</script>
</body>
</html>
